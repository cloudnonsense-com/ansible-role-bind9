# defaults/main.yml
# https://hub.docker.com/r/ubuntu/bind9
---
bind9_container_name: "bind9"
bind9_image: "ubuntu/bind9:latest"

bind9_network: "bind9_network" # this is the docker network
bind9_user: "root"
bind9_timezone: "UTC"

bind9_keys: []
  # - name: tsig-key
  #   algorithm: hmac-sha256
  #   secret: exampleBase64SecretString=

bind9_controls: []
  # - inet: 127.0.0.1
  #   port: 953
  #   allow:
  #     - "127.0.0.1"
  #   keys:
  #     - "tsig-key"

bind9_acls: []
  # - name: internal
  #   entries:
  #     - "192.168.0.0/24"
  #     - "192.168.1.0/24"
  #     - "192.168.2.0/24"

bind9_options_recursion: "yes"
bind9_options_forward: "only"
bind9_options_auth_nxdomain: "no"

bind9_options_forwarders: [ ]
  # - 9.9.9.9           # quad9
  # - 149.112.112.112   # quad9
  # - 1.1.1.3           # cloudflare
  # - 1.0.0.3           # cloudflare
  # - 8.8.8.8           # google
  # - 8.8.4.4           # google

bind9_options_allow_query: [ any ]
  # - internal

bind9_options_dnssec_validation: "no" # (yes|no|auto)

bind9_forward_zones: []
